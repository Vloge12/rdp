
name: Windows Software Setup

on:
  workflow_dispatch:

jobs:
  build:
    name: Install Software and Run Loop
    runs-on: windows-latest

    steps:
      - name: Install WinRAR
        shell: pwsh
        run: |
          $url = "https://www.rarlab.com/rar/winrar-x64-712.exe"
          $path = "$env:TEMP\winrar.exe"

          Invoke-WebRequest -Uri $url -OutFile $path
          Start-Process $path -ArgumentList "/S" -Wait

          Write-Output "WinRAR installed."

      - name: Install IDM
        shell: pwsh
        run: |
          $url = "https://mirror2.internetdownloadmanager.com/idman642build41.exe"
          $path = "$env:TEMP\idm.exe"

          Invoke-WebRequest -Uri $url -OutFile $path
          Start-Process $path -ArgumentList "/skipdlgs" -Wait

          Write-Output "IDM installed."

      - name: Windows Optimization
        shell: pwsh
        run: |
          $zip = "$env:TEMP\nircmd.zip"
          $dest = "$env:TEMP\nircmd"

          Invoke-WebRequest `
            -Uri "https://www.nirsoft.net/utils/nircmd.zip" `
            -OutFile $zip

          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force

          $exe = Join-Path $dest "nircmd.exe"

          if (Test-Path $exe) {
              & $exe setdisplay 1366 768 32
          }

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null

          Set-ItemProperty -Path $theme -Name AppsUseLightTheme -Value 0
          Set-ItemProperty -Path $theme -Name SystemUsesLightTheme -Value 0

          Add-Type -AssemblyName System.Drawing

          $bmp = New-Object System.Drawing.Bitmap(1920,1080)
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)

          $graphics.Clear([System.Drawing.Color]::Black)

          $wallpaper = "$env:TEMP\black.bmp"
          $bmp.Save($wallpaper)

          $graphics.Dispose()
          $bmp.Dispose()

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name Wallpaper `
            -Value $wallpaper

          Write-Output "Optimization completed."

      - name: Download and Validate VPN Archive
        shell: pwsh
        run: |
          $vpnURL = "https://www.dropbox.com/scl/fo/a6c0sqactnwr26cbbv1uc/APO1J80osQpo_8EoBOU3eJA?rlkey=s7wgg6ieuhlkr7wlxa9j9yij6&dl=1"

          $zipPath = "$env:TEMP\vpn.zip"
          $destination = "$env:USERPROFILE\Desktop\vpn"

          Write-Output "Downloading VPN archive..."

          curl.exe -fL $vpnURL -o $zipPath

          if ($LASTEXITCODE -ne 0) {
              throw "VPN download failed."
          }

          if (-not (Test-Path $zipPath)) {
              throw "VPN archive not found."
          }

          if ((Get-Item $zipPath).Length -lt 1000) {
              throw "Invalid VPN archive."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
              $root = [System.IO.Path]::GetFullPath($destination).TrimEnd('\') + '\'

              foreach ($entry in $archive.Entries) {
                  $target = [System.IO.Path]::GetFullPath(
                      [System.IO.Path]::Combine($destination, $entry.FullName)
                  )

                  if (-not $target.StartsWith(
                      $root,
                      [System.StringComparison]::OrdinalIgnoreCase
                  )) {
                      throw "Unsafe ZIP entry detected: $($entry.FullName)"
                  }
              }
          }
          finally {
              $archive.Dispose()
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          Expand-Archive `
            -LiteralPath $zipPath `
            -DestinationPath $destination `
            -Force

          Write-Output "VPN archive extracted successfully."
          Write-Output "Review and verify its contents before running installers."

      - name: Download Virtual Audio Driver
        shell: pwsh
        run: |
          $url = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip"

          $zip = "$env:TEMP\vb.zip"
          $dest = "$env:TEMP\vb"

          Invoke-WebRequest -Uri $url -OutFile $zip

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $dest `
            -Force

          Write-Output "Virtual audio driver downloaded."

      - name: Run Loop
        shell: pwsh
        run: |
          $loopPath = "$env:TEMP\Loop"

          git clone https://github.com/Alex15969/Loop $loopPath

          if (Test-Path "$loopPath\loop.bat") {
              Set-Location $loopPath
              cmd.exe /c loop.bat
          }
          else {
              throw "loop.bat was not found."
          }

      - name: Finish
        shell: pwsh
        run: |
          Write-Output "Setup completed."
          Write-Output "Tor removed."
          Write-Output "Discord removed."
